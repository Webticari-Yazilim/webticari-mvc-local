name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PHP: webticari-yazilim/webticari-mvc-local-php
  IMAGE_NAME_NGINX: webticari-yazilim/webticari-mvc-local-nginx
  IMAGE_NAME_WS: webticari-yazilim/webticari-mvc-local-ws

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Init submodule (src)
        shell: bash
        run: |
          git submodule sync --recursive
          git -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="git@github.com:" \
            -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="https://github.com/" \
            submodule update --init --recursive --depth=1 src
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/WebticariBootstrapper/WebticariBootstrapper.csproj
      - run: dotnet publish src/WebticariBootstrapper/WebticariBootstrapper.csproj -c Release -r win-x64 --self-contained true -o out/installer/
      - run: Compress-Archive -Path out/installer/* -DestinationPath out/WebticariMvcLocalInstaller.zip
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: out/WebticariMvcLocalInstaller.zip
          retention-days: 1

  build-local-exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Init submodule (src)
        shell: bash
        run: |
          git submodule sync --recursive
          git -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="git@github.com:" \
            -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="https://github.com/" \
            submodule update --init --recursive --depth=1 src
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet
        run: nuget restore src/WebticariLocalService.sln
      - name: Build local exe (Release x86)
        run: msbuild src/WebticariLocalService.sln /p:Configuration=Release /p:Platform=x86 /p:DeployOnBuild=false
      - name: Package local service
        run: |
          mkdir dist\WebticariLocalService
          copy "src\WebticariLocalService\bin\Release\*.exe" dist\WebticariLocalService\
          copy "src\WebticariLocalService\bin\Release\*.dll" dist\WebticariLocalService\
          copy "src\WebticariLocalService\bin\Release\*.config" dist\WebticariLocalService\
          copy "src\WebticariLocalService\bin\Release\*.xml" dist\WebticariLocalService\ 2>$null || echo no xml
          copy "src\WLSStartupService\bin\Release\*.exe" dist\ 2>$null || echo skip
          Compress-Archive -Path dist\* -DestinationPath out\WebticariLocalService.zip
      - uses: actions/upload-artifact@v4
        with:
          name: local-exe
          path: out\WebticariLocalService.zip
          retention-days: 1

  build-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone MVC submodule
        shell: bash
        run: |
          git submodule sync --recursive
          git -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="git@github.com:" \
            -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="https://github.com/" \
            submodule update --init --recursive --depth=1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/metadata-action@v5
        id: meta-php
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PHP }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.php
          push: true
          tags: ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          build-args: APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nginx:
    runs-on: ubuntu-latest
    needs: build-php
    steps:
      - uses: actions/checkout@v4
      - name: Init docker submodule
        shell: bash
        run: |
          git submodule sync
          git -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth=1 docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/metadata-action@v5
        id: meta-nginx
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NGINX }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.nginx
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-websocket:
    runs-on: ubuntu-latest
    needs: build-php
    steps:
      - uses: actions/checkout@v4
      - name: Init docker submodule
        shell: bash
        run: |
          git submodule sync
          git -c url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth=1 docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/metadata-action@v5
        id: meta-ws
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WS }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.websocket
          push: true
          tags: ${{ steps.meta-ws.outputs.tags }}
          labels: ${{ steps.meta-ws.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PHP }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-packages:
    runs-on: ubuntu-latest
    needs: [build-php, build-nginx, build-websocket]
    steps:
      - name: Make packages public
        run: |
          for pkg in webticari-mvc-local-php webticari-mvc-local-nginx webticari-mvc-local-ws; do
            echo "Setting $pkg visibility: public..."
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/Webticari-Yazilim/packages/container/$pkg" \
              -d '{"visibility":"public"}'
            echo ""
          done

  release:
    runs-on: ubuntu-latest
    needs: [build-installer, build-local-exe, publish-packages]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: installer
      - uses: actions/download-artifact@v4
        with:
          name: local-exe
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            WebticariMvcLocalInstaller.zip
            WebticariLocalService.zip
